name: Smoke Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    name: ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: 0

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net48
          - os: ubuntu-latest
            framework: net8.0
          - os: ubuntu-latest
            framework: net9.0
          - os: ubuntu-latest
            framework: net10.0

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-smoke-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-smoke-
            ${{ runner.os }}-nuget-

      - name: Pack NetDuid into local feed
        shell: bash
        run: |
          mkdir -p smoketests/feed
          dotnet pack src/NetDuid/NetDuid.csproj \
            --configuration Release \
            --output smoketests/feed \
            -p:VersionFromCI=99.0.0-smoke \
            --verbosity quiet

      - name: Restore SmokeTests consumer
        run: dotnet restore smoketests/SmokeTests/SmokeTests.csproj -p:NetDuidVersion=99.0.0-smoke --verbosity quiet

      - name: Build SmokeTests consumer (${{ matrix.framework }})
        run: dotnet build smoketests/SmokeTests/SmokeTests.csproj --no-restore --configuration Release --framework ${{ matrix.framework }} -p:NetDuidVersion=99.0.0-smoke --verbosity quiet

      - name: Run smoke tests (${{ matrix.framework }})
        run: >
          dotnet run
          --project smoketests/SmokeTests/SmokeTests.csproj
          --framework ${{ matrix.framework }}
          --configuration Release
          --no-build
          -p:NetDuidVersion=99.0.0-smoke
